<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" role="img" aria-label="Gabriel Trisi — Desenvolvedor Fullstack">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33"/>
      <stop offset="55%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <radialGradient id="signal" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#f2d38a" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#d9b463" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#d9b463" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe0f5"/>
    </linearGradient>
    <style>
      #glow  { animation: pulse 3.2s ease-in-out infinite; transform-origin:905px 92px; }
      #bat   { animation: fly 9s linear infinite; }
      #batwing{ animation: flap 0.5s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
      .twk   { animation: tw 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.75;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }
      @keyframes fly   { 0%{transform:translate(-140px,40px) scale(.5)} 100%{transform:translate(1140px,-10px) scale(.5)} }
      @keyframes flap  { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.55)} }
      @keyframes tw    { 0%,100%{opacity:.25} 50%{opacity:.9} }
      @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
    </style>
  </defs>

  <rect width="1100" height="250" rx="10" fill="url(#sky)"/>

  <!-- estrelas -->
  <g fill="#cfe0f5">
    <circle class="twk" cx="120" cy="40" r="1.4"/>
    <circle class="twk" cx="300" cy="30" r="1.1" style="animation-delay:-1s"/>
    <circle class="twk" cx="520" cy="48" r="1.3" style="animation-delay:-1.6s"/>
    <circle class="twk" cx="680" cy="26" r="1.1" style="animation-delay:-.6s"/>
    <circle class="twk" cx="1000" cy="50" r="1.3" style="animation-delay:-2.2s"/>
  </g>

  <!-- bat-signal -->
  <g id="glow"><ellipse cx="905" cy="92" rx="120" ry="120" fill="url(#signal)"/></g>
  <g transform="translate(905,92) scale(1.15)" fill="#0a0f1a" opacity=".9">
    <path d="M0 -14 C -6 -30 -22 -34 -34 -26 C -26 -26 -22 -18 -24 -8 C -14 -14 -8 -10 0 4 C 8 -10 14 -14 24 -8 C 22 -18 26 -26 34 -26 C 22 -34 6 -30 0 -14 Z"/>
  </g>

  <!-- skyline -->
  <g fill="#060b16">
    <rect x="0" y="205" width="1100" height="45"/>
    <rect x="40" y="180" width="46" height="70"/><rect x="96" y="196" width="34" height="54"/>
    <rect x="150" y="168" width="40" height="82"/><rect x="205" y="188" width="30" height="62"/>
    <rect x="250" y="200" width="52" height="50"/><rect x="700" y="186" width="38" height="64"/>
    <rect x="748" y="172" width="44" height="78"/><rect x="800" y="196" width="30" height="54"/>
    <rect x="980" y="182" width="42" height="68"/><rect x="1030" y="198" width="40" height="52"/>
  </g>
  <g fill="#d9b463" opacity=".7">
    <rect class="twk" x="54" y="192" width="4" height="4"/><rect class="twk" x="164" y="182" width="4" height="4" style="animation-delay:-1s"/>
    <rect class="twk" x="762" y="188" width="4" height="4" style="animation-delay:-1.4s"/><rect class="twk" x="994" y="196" width="4" height="4" style="animation-delay:-.7s"/>
  </g>

  <!-- morcego voando -->
  <g id="bat" fill="#0a0f1a">
    <g id="batwing"><path d="M0 -5 C -5 -12 -14 -13 -20 -9 C -14 -9 -12 -4 -13 2 C -6 -3 -3 -2 0 4 C 3 -2 6 -3 13 2 C 12 -4 14 -9 20 -9 C 14 -13 5 -12 0 -5 Z"/></g>
  </g>

  <!-- ===== wordmark: Gabriel Trisi (G com capuz do Batman) ===== -->
  <text x="378" y="150" font-size="86" font-weight="900" letter-spacing="1" fill="url(#name)" style="paint-order:stroke;stroke:#0a0f1a;stroke-width:2px"><tspan id="gl">G</tspan>abriel Trisi</text>

  <!-- capuz do Batman sobre o topo do G (centro x=407) -->
  <g>
    <path d="M382 112 L386 92 L393 56 L401 92 L407 98 L413 92 L421 56 L428 92 L432 112 L407 122 Z"
          fill="#0b1220" stroke="#e7c274" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- olhos brancos (bravos) -->
    <path d="M390 106 L403 111 L391 114 Z" fill="#ffffff"/>
    <path d="M424 106 L411 111 L423 114 Z" fill="#ffffff"/>
  </g>

  <!-- subtítulo -->
  <text x="380" y="188" font-size="21" font-weight="600" letter-spacing="1.5" fill="#9fb6d6">Desenvolvedor Fullstack · TypeScript de ponta a ponta</text>
</svg>

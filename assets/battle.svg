<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" font-family="'Courier New',ui-monospace,monospace" role="img" aria-label="Arena arcade: fighter DEV vs BUG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2148"/>
      <stop offset="1" stop-color="#06122b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12294f"/>
      <stop offset="1" stop-color="#0a1b38"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="70%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <style>
      .bob     { animation: bob 1.9s ease-in-out infinite; }
      .bob2    { animation: bob 1.9s ease-in-out infinite; animation-delay:-.95s; }
      #dev     { animation: dashDev 6s ease-in-out infinite; }
      #bug     { animation: dashBug 6s ease-in-out infinite; }
      #armDev  { animation: jabDev 6s ease-out infinite; }
      #armBug  { animation: jabBug 6s ease-out infinite; }
      #scene   { animation: shake 6s linear infinite; }
      #hpDev > rect.fill { animation: hpDev 6s ease-out infinite; transform-box:fill-box; transform-origin:left center; }
      #hpBug > rect.fill { animation: hpBug 6s ease-out infinite; transform-box:fill-box; transform-origin:right center; }
      .hit1 { animation: hit1 6s ease-out infinite; }
      .hit2 { animation: hit2 6s ease-out infinite; }
      .hit3 { animation: hit3 6s ease-out infinite; }
      #fightTxt { animation: fightTxt 6s ease-out infinite; }
      .spark { animation: spark 2.4s linear infinite; }

      @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
      @keyframes dashDev {
        0%,14%{transform:translateX(0)} 16%{transform:translateX(16px)} 22%{transform:translateX(0)}
        50%{transform:translateX(0)} 53%{transform:translateX(-30px)} 61%{transform:translateX(-30px)} 69%{transform:translateX(0)}
        76%{transform:translateX(0)} 78%{transform:translateX(16px)} 84%{transform:translateX(0)} 100%{transform:translateX(0)} }
      @keyframes dashBug {
        0%,16%{transform:translateX(0)} 18%{transform:translateX(34px)} 27%{transform:translateX(34px)} 35%{transform:translateX(0)}
        50%{transform:translateX(0)} 52%{transform:translateX(-34px)} 59%{transform:translateX(-34px)} 65%{transform:translateX(0)}
        78%{transform:translateX(0)} 80%{transform:translateX(30px)} 89%{transform:translateX(30px)} 95%{transform:translateX(0)} 100%{transform:translateX(0)} }
      @keyframes jabDev {
        0%,14%{transform:translateX(0)} 16%{transform:translateX(26px)} 21%{transform:translateX(26px)} 25%{transform:translateX(0)}
        76%{transform:translateX(0)} 78%{transform:translateX(26px)} 83%{transform:translateX(26px)} 87%{transform:translateX(0)} 100%{transform:translateX(0)} }
      @keyframes jabBug {
        0%,50%{transform:translateX(0)} 52%{transform:translateX(-26px)} 57%{transform:translateX(-26px)} 61%{transform:translateX(0)} 100%{transform:translateX(0)} }
      @keyframes shake {
        0%,15.5%{transform:translate(0,0)} 16.5%{transform:translate(3px,-2px)} 17.5%{transform:translate(-3px,2px)} 19%{transform:translate(0,0)}
        51.5%{transform:translate(0,0)} 52.5%{transform:translate(-3px,2px)} 53.5%{transform:translate(3px,-2px)} 55%{transform:translate(0,0)}
        77.5%{transform:translate(0,0)} 78.5%{transform:translate(3px,-2px)} 79.5%{transform:translate(-3px,2px)} 81%{transform:translate(0,0)} 100%{transform:translate(0,0)} }
      @keyframes hpBug { 0%,17%{transform:scaleX(1)} 19%{transform:scaleX(.66)} 79%{transform:scaleX(.66)} 81%{transform:scaleX(.34)} 100%{transform:scaleX(.34)} }
      @keyframes hpDev { 0%,52%{transform:scaleX(1)} 54%{transform:scaleX(.74)} 100%{transform:scaleX(.74)} }
      @keyframes hit1 { 0%,15%{opacity:0;transform:scale(.3)} 16.5%{opacity:1;transform:scale(1.15)} 21%{opacity:0;transform:scale(1.4)} 100%{opacity:0} }
      @keyframes hit2 { 0%,51%{opacity:0;transform:scale(.3)} 52.5%{opacity:1;transform:scale(1.15)} 57%{opacity:0;transform:scale(1.4)} 100%{opacity:0} }
      @keyframes hit3 { 0%,77%{opacity:0;transform:scale(.3)} 78.5%{opacity:1;transform:scale(1.25)} 83%{opacity:0;transform:scale(1.5)} 100%{opacity:0} }
      @keyframes fightTxt { 0%{opacity:0;transform:scale(.6)} 5%{opacity:1;transform:scale(1)} 11%{opacity:1;transform:scale(1)} 16%{opacity:0;transform:scale(1.3)} 100%{opacity:0} }
      @keyframes spark { 0%{opacity:.25} 50%{opacity:.9} 100%{opacity:.25} }
      @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
    </style>
  </defs>

  <!-- moldura -->
  <rect x="1.5" y="1.5" width="817" height="237" rx="16" fill="url(#bg)" stroke="#c7a96f" stroke-opacity=".55" stroke-width="2"/>

  <g id="scene">
    <!-- estrelas / faíscas de fundo -->
    <g fill="#c7a96f">
      <circle class="spark" cx="120" cy="46" r="1.6"/>
      <circle class="spark" cx="690" cy="60" r="1.6" style="animation-delay:-1s"/>
      <circle class="spark" cx="410" cy="38" r="1.4" style="animation-delay:-1.6s"/>
      <circle class="spark" cx="250" cy="70" r="1.3" style="animation-delay:-.5s"/>
      <circle class="spark" cx="560" cy="44" r="1.3" style="animation-delay:-2s"/>
    </g>

    <!-- chão -->
    <rect x="10" y="190" width="800" height="40" rx="8" fill="url(#floor)"/>
    <g stroke="#1c3970" stroke-width="1.4">
      <line x1="70" y1="205" x2="10" y2="230"/>
      <line x1="220" y1="205" x2="150" y2="230"/>
      <line x1="370" y1="205" x2="320" y2="230"/>
      <line x1="520" y1="205" x2="500" y2="230"/>
      <line x1="670" y1="205" x2="700" y2="230"/>
      <line x1="800" y1="205" x2="760" y2="230"/>
      <line x1="10" y1="205" x2="810" y2="205" stroke="#20437e"/>
    </g>
    <ellipse cx="310" cy="192" rx="34" ry="6" fill="#000" opacity=".28"/>
    <ellipse cx="510" cy="192" rx="34" ry="6" fill="#000" opacity=".28"/>

    <!-- ===== barras de vida ===== -->
    <g id="hpDev">
      <text x="40" y="22" fill="#3B8EF7" font-size="13" font-weight="bold" letter-spacing="2">DEV</text>
      <rect x="40" y="28" width="300" height="15" rx="7.5" fill="#0a1a34" stroke="#1c3970"/>
      <rect class="fill" x="42.5" y="30.5" width="295" height="10" rx="5" fill="#37D67A"/>
    </g>
    <g id="hpBug">
      <text x="780" y="22" fill="#E4C87E" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="end">BUG</text>
      <rect x="480" y="28" width="300" height="15" rx="7.5" fill="#0a1a34" stroke="#1c3970"/>
      <rect class="fill" x="482.5" y="30.5" width="295" height="10" rx="5" fill="#E85D5D"/>
    </g>
    <text x="410" y="40" fill="#c7a96f" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">ROUND 1</text>

    <!-- ===== DEV (azul, olhando pra direita) ===== -->
    <g id="dev">
      <g class="bob">
        <rect x="298" y="160" width="9" height="30" rx="2" fill="#1E5FBF"/>
        <rect x="312" y="160" width="9" height="30" rx="2" fill="#3B8EF7"/>
        <rect x="296" y="126" width="26" height="38" rx="5" fill="#3B8EF7"/>
        <rect x="296" y="150" width="26" height="6" fill="#c7a96f"/>
        <rect x="289" y="130" width="8" height="21" rx="3" fill="#1E5FBF"/>
        <rect x="299" y="103" width="23" height="23" rx="6" fill="#3B8EF7"/>
        <rect x="312" y="110" width="8" height="5" rx="1" fill="#E4C87E"/>
        <!-- braço que soca -->
        <g id="armDev">
          <rect x="318" y="132" width="12" height="9" rx="3" fill="#3B8EF7"/>
          <rect x="329" y="131" width="9" height="11" rx="3" fill="#E4C87E"/>
        </g>
      </g>
    </g>

    <!-- ===== BUG (âmbar/vermelho, olhando pra esquerda) ===== -->
    <g id="bug">
      <g class="bob2">
        <rect x="513" y="160" width="9" height="30" rx="2" fill="#B7893F"/>
        <rect x="499" y="160" width="9" height="30" rx="2" fill="#E4C87E"/>
        <rect x="498" y="126" width="26" height="38" rx="5" fill="#E4C87E"/>
        <rect x="498" y="150" width="26" height="6" fill="#2F81F7"/>
        <rect x="523" y="130" width="8" height="21" rx="3" fill="#B7893F"/>
        <rect x="498" y="103" width="23" height="23" rx="6" fill="#E4C87E"/>
        <rect x="500" y="110" width="8" height="5" rx="1" fill="#C0392B"/>
        <!-- anteninhas de "bug" -->
        <rect x="503" y="97" width="2.5" height="8" rx="1" fill="#B7893F" transform="rotate(-18 504 101)"/>
        <rect x="514" y="97" width="2.5" height="8" rx="1" fill="#B7893F" transform="rotate(18 515 101)"/>
        <!-- membro que ataca -->
        <g id="armBug">
          <rect x="490" y="132" width="12" height="9" rx="3" fill="#E4C87E"/>
          <rect x="482" y="131" width="9" height="11" rx="3" fill="#C0392B"/>
        </g>
      </g>
    </g>

    <!-- ===== impactos ===== -->
    <g class="hit1" transform-origin="492 118">
      <path d="M492 96 l7 14 15 2 -11 11 3 15 -14-7 -14 7 3-15 -11-11 15-2z" fill="#fff"/>
      <path d="M492 102 l4.5 9 10 1.3 -7.5 7 2 10 -9-4.6 -9 4.6 2-10 -7.5-7 10-1.3z" fill="#E4C87E"/>
      <text x="492" y="122" fill="#0d2148" font-size="9" font-weight="bold" text-anchor="middle">POW</text>
    </g>
    <g class="hit3" transform-origin="492 118">
      <path d="M492 92 l8 16 17 2 -12 12 3 17 -16-8 -16 8 3-17 -12-12 17-2z" fill="#fff"/>
      <path d="M492 100 l5 10 11 1.4 -8 7.6 2 11 -10-5 -10 5 2-11 -8-7.6 11-1.4z" fill="#E85D5D"/>
      <text x="492" y="120" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">HIT!</text>
    </g>
    <g class="hit2" transform-origin="328 118">
      <path d="M328 98 l6 12 13 1.6 -9.5 9 2.5 13 -12-6 -12 6 2.5-13 -9.5-9 13-1.6z" fill="#fff"/>
      <text x="328" y="121" fill="#0d2148" font-size="8" font-weight="bold" text-anchor="middle">BUG</text>
    </g>

    <!-- FIGHT! -->
    <text id="fightTxt" x="410" y="140" fill="#E4C87E" font-size="46" font-weight="bold" text-anchor="middle" letter-spacing="3" style="paint-order:stroke;stroke:#0d2148;stroke-width:5px;transform-origin:410px 128px">FIGHT!</text>

    <rect x="1.5" y="1.5" width="817" height="237" rx="16" fill="url(#vig)" pointer-events="none"/>
  </g>
</svg>
